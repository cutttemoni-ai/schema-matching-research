<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataFit · 검토와 승인</title><meta name="theme-color" content="#5844e8"><link rel="stylesheet" href="/static/app.css"><script src="/static/app.js" defer></script></head>
<body><a class="skip" href="#main">본문으로 이동</a>
<div class="shell">
<aside class="sidebar"><a class="brand" href="/" aria-label="DataFit 홈"><span class="logo">↗</span><span>DataFit <small>AI</small></span></a>
<div class="nav-caption">작업 공간</div><nav class="nav" aria-label="주 메뉴"><button data-page="home" class="active"><span class="navicon" aria-hidden="true">⌂</span><span>작업 홈</span></button><button data-page="new"><span class="navicon" aria-hidden="true">＋</span><span>새 CSV 연결</span></button><button data-page="review"><span class="navicon" aria-hidden="true">☷</span><span>검토·승인</span></button></nav>
<div class="side-bottom"><div class="store"><span class="store-icon">S</span><div><strong>스키마 매칭</strong><small>사람이 확인하는 데이터 연결</small></div></div><div class="demo-note"><strong>C · 전체 프로파일</strong><p>AI는 연결을 추천합니다.<br>최종 규칙은 사람이 승인합니다.</p></div></div></aside>
<div class="stage"><header class="topbar"><div class="global-search"><span aria-hidden="true">⌕</span><input id="global-search" aria-label="작업 검색" placeholder="작업명 또는 파일명 검색"><span aria-hidden="true">→</span></div><div class="top-right"><span class="online">서비스 연결됨</span><div class="avatar" id="avatar">S</div><div><strong id="user-label">검토 담당자</strong><small id="user-sub">로그인 후 작업을 시작하세요</small></div><button id="logout" class="text-link" hidden>로그아웃</button></div></header>
<main id="main" class="main-wrap" tabindex="-1"><div id="view"></div></main></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="profile-dialog"><div class="modal-head"><h2>실제로 사용하는 데이터 특징</h2><button class="close" data-close="profile-dialog" aria-label="닫기">×</button></div><div class="modal-body"><p class="muted">계산 가능한 전체 프로파일입니다. 상위 범주에는 실제 값 문자열이 포함되며 원시 행 전체는 전송하지 않습니다.</p><div id="profile-overview"></div><details><summary>상세 계산 기준과 전체 프로파일</summary><pre id="profile-json"></pre></details></div></dialog>
<dialog id="preview-dialog"><div class="modal-head"><h2>승인 전 결과 미리보기</h2><button class="close" data-close="preview-dialog" aria-label="닫기">×</button></div><div class="modal-body" id="preview-body"></div></dialog>
<dialog id="record-dialog"><div class="modal-head"><h2>최초 추천·승인·실행 기록</h2><button class="close" data-close="record-dialog" aria-label="닫기">×</button></div><div class="modal-body"><pre id="record-json"></pre></div></dialog>
</body></html>
