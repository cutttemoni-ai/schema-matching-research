<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataFit · 검토와 승인</title><meta name="theme-color" content="#5844e8"><link rel="stylesheet" href="/static/app.css"><script src="/static/app.js" defer></script></head>
<body><a class="skip" href="#main">본문으로 이동</a>
<div class="shell">
<aside class="sidebar"><a class="brand" href="/" aria-label="DataFit 홈">DataFit</a><p class="nav-caption">CSV 항목 연결</p><nav class="nav" aria-label="주 메뉴"><button data-page="home" class="active">작업 목록</button><button data-page="new">파일 업로드</button><button data-page="review">연결 검토</button></nav><div class="side-bottom"><p>원본 값은 보존하고<br>확인한 연결만 승인합니다.</p></div></aside>
<div class="stage"><header class="topbar"><div class="global-search"><input id="global-search" aria-label="작업 검색" placeholder="작업명·파일명 검색"></div><div class="top-right"><div class="avatar" id="avatar" aria-hidden="true">S</div><div><strong id="user-label">작업 계정</strong><small id="user-sub">로그인 후 파일을 등록하세요</small></div><button id="logout" class="text-link" hidden>로그아웃</button></div></header>
<main id="main" class="main-wrap" tabindex="-1"><div id="action-error" role="alert" hidden></div><p id="busy-indicator" role="status" hidden>요청을 처리 중입니다. 완료될 때까지 기다려 주세요.</p><div id="view"></div></main></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="profile-dialog"><div class="modal-head"><h2>데이터 특징 확인</h2><button class="close" data-close="profile-dialog" aria-label="닫기">×</button></div><div class="modal-body"><p class="muted">빈 값의 비율·값의 종류·숫자와 날짜 범위를 확인하세요.추천에는 계산 가능한 전체 특징을 사용하며, 빈출 값에는 실제 값 문자열이 포함됩니다.</p><div id="profile-overview"></div><details><summary>상세 계산 기준과 전체 분석 결과</summary><pre id="profile-json"></pre></details></div></dialog>
<dialog id="preview-dialog"><div class="modal-head"><h2>승인 전 결과 미리보기</h2><button class="close" data-close="preview-dialog" aria-label="닫기">×</button></div><div class="modal-body" id="preview-body"></div></dialog>
<dialog id="record-dialog"><div class="modal-head"><h2>최초 추천·승인·실행 기록</h2><button class="close" data-close="record-dialog" aria-label="닫기">×</button></div><div class="modal-body"><pre id="record-json"></pre></div></dialog>
</body></html>
